<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f0d" />
    <meta name="description" content="Tufani — a lite, browser-based battle royale. The storm decides." />
    <link rel="icon" href="data:," />
    <title>Tufani — the storm decides</title>
    <style>
      :root {
        --bg: #0b0f0d;
        --panel: rgba(14, 22, 18, 0.82);
        --line: rgba(214, 184, 74, 0.28);
        --text: #e7e4d8;
        --muted: #9aa79d;
        --gold: #d6b84a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      .hud {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 20px 24px;
        pointer-events: none;
      }

      .brand { line-height: 1; }

      .brand h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 36px);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text);
      }

      .brand p {
        margin: 8px 0 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        backdrop-filter: blur(8px);
      }

      .badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 10px var(--gold);
      }

      .footer-hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 24px;
        pointer-events: none;
        font-size: 12px;
      }

      .controls {
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        line-height: 1.7;
        color: var(--muted);
      }

      .controls strong { color: var(--text); font-weight: 600; }

      kbd {
        display: inline-block;
        min-width: 20px;
        padding: 1px 5px;
        font: inherit;
        font-size: 11px;
        text-align: center;
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
      }

      #status,
      #storm-status {
        padding: 9px 13px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        backdrop-filter: blur(8px);
      }

      #storm-status {
        color: var(--gold);
        transition: color 0.3s, border-color 0.3s;
      }

      #storm-status.is-closing {
        color: #ff8f6b;
        border-color: rgba(255, 143, 107, 0.5);
      }

      .vitals {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .health {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 13px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }

      .health-track {
        width: clamp(120px, 18vw, 180px);
        height: 6px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
      }

      #health-fill {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--gold);
        transition: width 0.15s linear, background 0.3s;
      }

      #health-fill.low { background: #e05a5a; }

      #health-value {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      @media (max-width: 640px) {
        .footer-hud { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <header class="hud">
      <div class="brand">
        <h1>Tufani</h1>
        <p>the storm decides</p>
      </div>
      <span class="badge">prototype · 0.1</span>
    </header>

    <div class="footer-hud">
      <div class="vitals">
        <div class="health">
          <span>hp</span>
          <span class="health-track"><i id="health-fill"></i></span>
          <span id="health-value">100</span>
        </div>
        <div class="chips">
          <span id="status">connecting…</span>
          <span id="storm-status">storm incoming</span>
        </div>
      </div>
      <div class="controls">
        <strong>move</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows<br />
        open a second tab to drop another player in
      </div>
    </div>

    <script>
      window.addEventListener("error", (e) => {
        document.getElementById("status").textContent = "error: " + e.message;
      });
      window.addEventListener("unhandledrejection", (e) => {
        document.getElementById("status").textContent = "error: " + (e.reason?.message || e.reason);
      });
    </script>
    <script type="module" src="/src/client/index.ts"></script>
  </body>
</html>
